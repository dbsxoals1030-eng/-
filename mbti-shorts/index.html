<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:500;src:url(fonts/Pretendard-Medium.otf)}
@font-face{font-family:P;font-weight:700;src:url(fonts/Pretendard-Bold.otf)}
@font-face{font-family:P;font-weight:800;src:url(fonts/Pretendard-ExtraBold.otf)}
@font-face{font-family:P;font-weight:900;src:url(fonts/Pretendard-Black.otf)}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P,sans-serif;word-break:keep-all}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%;white-space:nowrap}
.mask{overflow:hidden}
.eyes{transform-box:fill-box;transform-origin:center}
.gear{transform-box:fill-box;transform-origin:center}
</style></head><body>
<div id="stage"></div>
<script src="mascots.js"></script>
<script src="episode.js"></script>
<script>
// Episode modes: "ranking" (TOP5 + gauge), "types" (5 types, no ranking), "list" (N items about one subject, N=4..7)
const W=1080,H=1920,DUR=40,MX=90;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,s,d)=>cl((t-s)/d);
const eOut5=x=>1-Math.pow(1-x,5);
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.3,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const stage=document.getElementById('stage');
const EP=window.EPISODE;
const MODE=EP.mode||'ranking';
const ITEMS=MODE==='list'?EP.items:EP.ranks;
const N=ITEMS.length;
const BEAT=.625, INTRO=3.75;
const ITEM=Math.floor((DUR-INTRO-5)/BEAT/N+1e-9)*BEAT;      // seconds per item (whole beats)
const OUTRO_START=INTRO+N*ITEM;

function A(parent,css,html='',cls='abs'){const d=document.createElement('div');d.className=cls;d.style.cssText=css;d.innerHTML=html;parent.appendChild(d);return d}
function T(el,x=0,y=0,s=1,r=0,o=1){
  if(o<=0.001||s<=0.001){el.style.opacity=0;return}
  el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`}
// masked text reveal: wrapper clips, inner slides up
function RV(parent,css,html,inner=''){
  const w=A(parent,css,'','abs mask');const i=document.createElement('div');i.innerHTML=html;i.style.cssText='will-change:transform;'+inner;w.appendChild(i);
  return {w,set:p=>{i.style.transform=`translateY(${(1-p)*115}%)`;w.style.visibility=p<=0?'hidden':'visible'}}
}
// <b>word</b> => accent-colored emphasis
const hl=(html,th)=>(html||'').replace(/<b>/g,`<span style="color:${th.acc};font-weight:900">`).replace(/<\/b>/g,'</span>');
// text measuring helpers (run after fonts are loaded)
function measure(html,css){const d=document.createElement('div');d.style.cssText='position:absolute;left:0;top:0;visibility:hidden;'+css;d.innerHTML=html;stage.appendChild(d);const r={w:d.offsetWidth,h:d.offsetHeight};d.remove();return r}
function fitFont(html,base,css,maxW,min=48){let fs=base;for(;fs>min;fs-=4){if(measure(html,`font-size:${fs}px;white-space:nowrap;${css}`).w<=maxW)break}return fs}
function fitBlock(html,css,width,maxH,sizes){let fs=sizes[sizes.length-1],h=0;for(const f of sizes){const m=measure(html,`width:${width}px;font-size:${f}px;white-space:normal;${css}`);fs=f;h=m.h;if(m.h<=maxH)break}return {fs,h}}

// ---------- themes ----------
const LIGHT={bg:'#ECE8E1',fg:'#1F1F1F',mut:'#8B857B',line:'rgba(31,31,31,.2)',circ:'#E3DED4',shadow:'rgba(31,31,31,.08)',acc:AC};
const DARK ={bg:'#1B1A19',fg:'#F1EDE6',mut:'#8F8A81',line:'rgba(241,237,230,.22)',circ:'#252321',shadow:'rgba(0,0,0,.4)',acc:'#E2674B'};
const scenes=[];
function mkScene(th){const s=document.createElement('div');s.className='scene';s.style.background=th.bg;stage.appendChild(s);return s}
const hair=(parent,x,y,w,th)=>A(parent,`left:${x}px;top:${y}px;width:${w}px;height:2px;background:${th.line};transform-origin:0 50%`);
const capRow=(s,th,left,right)=>{
  const c1=RV(s,`left:${MX}px;top:150px;height:44px`,`<div style="font-size:28px;font-weight:700;color:${th.mut};letter-spacing:3px">${left}</div>`);
  const c2=RV(s,`right:${MX}px;left:auto;top:150px;height:44px`,`<div style="font-size:28px;font-weight:700;color:${th.mut};letter-spacing:3px">${right}</div>`);
  const h0=hair(s,MX,208,W-MX*2,th);
  return u=>{c1.set(eOut5(pr(u,.3,.6)));c2.set(eOut5(pr(u,.3,.6)));h0.style.transform=`scaleX(${eIO(pr(u,.15,.7))})`}
};

// ---------- intro ----------
function buildIntro(){
  const th=DARK,s=mkScene(th);
  const I=EP.intro||{cap:'MBTI · LOVE',l1:EP.title_prefix,l2:'MBTI',l3:'TOP <b>5</b>'};
  const cap=RV(s,`left:${MX}px;top:200px;height:50px`,`<div style="font-size:32px;font-weight:600;color:${th.mut};letter-spacing:6px">${I.cap}</div>`);
  const f1=fitFont(I.l1,92,'font-weight:600;letter-spacing:-2px',W-MX*2),f2=fitFont(I.l2,290,'font-weight:900;letter-spacing:-12px',W-MX*2-10,100),f3=fitFont(I.l3,220,'font-weight:900;letter-spacing:-8px',W-MX*2-10,80);
  let y=330;const h1=Math.round(f1*1.3),h2=Math.round(f2*1.08),h3=Math.round(f3*1.1);
  const l1=RV(s,`left:${MX}px;top:${y}px;height:${h1}px`,`<div style="font-size:${f1}px;font-weight:600;color:${th.fg};letter-spacing:-2px;line-height:1.3">${hl(I.l1,th)}</div>`);y+=h1;
  const l2=RV(s,`left:${MX-8}px;top:${y}px;height:${h2}px`,`<div style="font-size:${f2}px;font-weight:900;color:${th.fg};letter-spacing:-12px;line-height:1.08">${hl(I.l2,th)}</div>`);y+=h2;
  const l3=RV(s,`left:${MX-8}px;top:${y}px;height:${h3}px`,`<div style="font-size:${f3}px;font-weight:900;color:${th.fg};letter-spacing:-8px;line-height:1.1">${hl(I.l3,th)}</div>`);y+=h3+30;
  const hlne=hair(s,MX,y,W-MX*2,th);
  const types=EP.intro_types||(MODE==='list'?['ISTP']:ITEMS.map(r=>r.type));
  const single=types.length===1;
  let mins,qTop;
  if(single){
    const sz=340;mins=[A(s,`left:${540-sz/2}px;top:${y+40}px;width:${sz}px;height:${sz}px`,mascot(types[0],sz,{mood:I.mood||'smirk'}))];mins[0].style.transformOrigin='50% 90%';qTop=y+40+sz+30;
  }else{
    mins=types.map((k,i)=>{const d=A(s,`left:${35+i*202}px;top:${y+60}px;width:200px;height:240px;text-align:center`,
      `<div>${mascot(k,184)}</div><div style="font-size:28px;font-weight:700;color:${th.mut};margin-top:10px;letter-spacing:2px">${k}</div>`);d.style.transformOrigin='50% 80%';return d});
    qTop=y+60+240+70;
  }
  const q=RV(s,`left:${MX}px;top:${qTop}px;height:90px`,`<div style="font-size:56px;font-weight:700;color:${th.fg};line-height:1.5">${EP.intro_q[0]}<span style="color:${th.acc}">${EP.intro_q[1]}</span>${EP.intro_q[2]}</div>`);
  scenes.push({el:s,start:0,wipe:false,update:t=>{
    cap.set(eOut5(pr(t,.05,.7)));l1.set(eOut5(pr(t,.15,.8)));l2.set(eOut5(pr(t,.35,.9)));l3.set(eOut5(pr(t,.8,.9)));
    hlne.style.transform=`scaleX(${eIO(pr(t,1.2,.8))})`;
    mins.forEach((d,i)=>{const st=1.55+(single?0:i*.16),p=eOut5(pr(t,st,.8));T(d,0,(1-p)*50+Math.sin(t*2.4+i)*-5,1,0,p);animFaces(d,t,i*.7)});
    q.set(eOut5(pr(t,2.75,.7)));
  }});
}

// ---------- ranking / types scenes ----------
function buildRank(R,idx){
  const types=MODE==='types',hasGauge=!types&&R.pct!=null;
  const th=idx===N-1?DARK:LIGHT,start=INTRO+idx*ITEM,s=mkScene(th);
  const n=N-idx;
  const capU=capRow(s,th,EP.caption,types?`${idx+1} / ${N}`:`${n} / ${N}`);
  const no=RV(s,`left:${MX}px;top:240px;height:64px`,`<div style="font-size:42px;font-weight:800;color:${th.acc};letter-spacing:7px">${types?(R.tag||`0${idx+1}`):`NO.${n}`}</div>`);
  const ty=RV(s,`left:${MX-6}px;top:300px;height:215px`,`<div style="font-size:196px;font-weight:900;color:${th.fg};letter-spacing:-7px;line-height:1.1">${R.type}</div>`);
  const nick=RV(s,`left:${MX}px;top:520px;height:84px`,`<div style="font-size:52px;font-weight:600;color:${th.fg};opacity:.78;line-height:1.5">${R.nick}</div>`);
  const circ=A(s,`left:${540-265}px;top:${862-265}px;width:530px;height:530px;border-radius:50%;background:${th.circ}`);
  const ground=A(s,`left:${540-190}px;top:1062px;width:380px;height:2px;background:${th.line};transform-origin:50% 50%`);
  const shadow=A(s,`left:${540-130}px;top:1048px;width:260px;height:26px;border-radius:50%;background:${th.shadow}`);
  const mw=A(s,`left:320px;top:620px;width:440px;height:440px`,mascot(R.type,440));mw.style.transformOrigin='50% 92%';
  let gl,gp,track,fill,dot;
  if(hasGauge){
    gl=RV(s,`left:${MX}px;top:1118px;height:50px`,`<div style="font-size:32px;font-weight:700;color:${th.mut};letter-spacing:1px;line-height:1.5">${EP.gauge_label}</div>`);
    gp=A(s,`right:${MX}px;left:auto;top:1076px;font-size:100px;font-weight:900;color:${th.acc};letter-spacing:-3px;text-align:right;line-height:1`,'');
    track=A(s,`left:${MX}px;top:1196px;width:${W-MX*2}px;height:6px;border-radius:3px;background:${th.line}`);
    fill=A(s,`left:${MX}px;top:1196px;width:0;height:6px;border-radius:3px;background:${th.acc}`);
    dot=A(s,`left:${MX}px;top:1182px;width:34px;height:34px;border-radius:50%;background:${th.acc};border:5px solid ${th.bg};box-sizing:border-box`);
  }
  const base=hasGauge?1262:1150,t0=hasGauge?1.875:1.25;
  const rows=R.traits.map((txt,i)=>{
    const y=base+i*92;const ln=hair(s,MX,y,W-MX*2,th);
    const r=RV(s,`left:${MX}px;top:${y+2}px;height:88px;width:${W-MX*2}px`,`<div style="font-size:46px;font-weight:700;color:${th.fg};line-height:88px"><span style="display:inline-block;width:84px;font-size:26px;font-weight:800;color:${th.acc};letter-spacing:2px;vertical-align:middle">0${i+1}</span>${hl(txt,th)}</div>`);
    return {ln,r,st:t0+i*BEAT}});
  const tipTop=hasGauge?1470:base+R.traits.length*92+28,tipSt=t0+R.traits.length*BEAT;
  const tip=A(s,`left:${MX}px;top:${tipTop}px;width:${W-MX*2}px;height:104px;border-radius:52px;background:${th.fg};display:flex;align-items:center;padding:0 40px;box-sizing:border-box`,
    `<div style="font-size:25px;font-weight:900;color:${th.acc};letter-spacing:3px;width:90px">${EP.tip_label||'TIP'}</div><div style="font-size:42px;font-weight:700;color:${th.bg}">${hl(R.tip,th)}</div>`);
  scenes.push({el:s,start,wipe:true,update:u=>{
    capU(u);no.set(eOut5(pr(u,.35,.6)));ty.set(eOut5(pr(u,.45,.8)));nick.set(eOut5(pr(u,.8,.7)));
    let p=eOut5(pr(u,.4,1));T(circ,0,0,.7+.3*p,0,pr(u,.4,.4));
    ground.style.transform=`scaleX(${eIO(pr(u,.6,.7))})`;
    const bob=Math.sin(u*2*Math.PI/1.25);p=eOut5(pr(u,.55,.9));
    T(mw,0,(1-p)*70-9*(bob*.5+.5)*p,1,Math.sin(u*2.2)*1.6*p,pr(u,.55,.25));mw.style.transform+=` scale(${1+.02*bob},${1-.015*bob})`;
    T(shadow,0,0,1-.07*(bob*.5+.5),0,pr(u,.7,.3));
    animFaces(mw,u,idx*.9);
    if(hasGauge){
      gl.set(eOut5(pr(u,1.2,.6)));const f=eOut5(pr(u,1.3,1.5));
      gp.innerHTML=Math.round(R.pct*f)+`<span style="font-size:44px;letter-spacing:0;margin-left:4px">${EP.gauge_unit||'%'}</span>`;gp.style.opacity=pr(u,1.2,.3);
      track.style.opacity=pr(u,1.2,.3);const wpx=(W-MX*2)*(R.pct/100)*f;fill.style.width=wpx+'px';fill.style.opacity=pr(u,1.25,.2);
      dot.style.left=(MX+wpx-17)+'px';dot.style.opacity=pr(u,1.25,.2);
    }
    rows.forEach(o=>{o.ln.style.transform=`scaleX(${eIO(pr(u,o.st,.6))})`;o.r.set(eOut5(pr(u,o.st+.1,.65)))});
    const tp=eOut5(pr(u,tipSt,.8));T(tip,0,(1-tp)*60,1,0,pr(u,tipSt,.3));
  }});
}

// ---------- list scenes (one subject, N items) ----------
function buildItem(it,idx){
  const th=idx===N-1?DARK:LIGHT,start=INTRO+idx*ITEM,s=mkScene(th);
  const capU=capRow(s,th,EP.caption,`${idx+1} / ${N}`);
  const tag=RV(s,`left:${MX}px;top:240px;height:64px`,`<div style="font-size:42px;font-weight:800;color:${th.acc};letter-spacing:7px">${EP.tag_word||'NO.'} 0${idx+1}</div>`);
  const tcss='font-weight:900;letter-spacing:-3px;line-height:1.18';
  const tf=fitBlock(hl(it.title,th),tcss,W-MX*2,350,[112,104,96,88,80,72]);
  const title=RV(s,`left:${MX}px;top:312px;height:${tf.h+8}px;width:${W-MX*2}px`,`<div style="font-size:${tf.fs}px;color:${th.fg};${tcss}">${hl(it.title,th)}</div>`,'white-space:normal');
  const dcss='font-weight:600;line-height:1.45';
  const df=fitBlock(hl(it.desc,th),dcss,W-MX*2,150,[46,42,38]);
  // flow layout: title | gap | circle+mascot | gap | desc | gap | chip  (gaps adapt to text length)
  const titleH=tf.h+8,descH=df.h+8,chipH=it.chip?104:0,bottom=it.chip?1560:1480;
  let free=bottom-(312+titleH+470+descH+chipH);
  const sc=1+Math.min(.25,Math.max(0,(free-250)/1200)),cs=470*sc;
  free=bottom-(312+titleH+cs+descH+chipH);
  const g=cl(free/(it.chip?3:2),30,110);
  const circTop=312+titleH+g,cy=circTop+cs/2,descTop=circTop+cs+g,chipTop=descTop+descH+g;
  const circ=A(s,`left:${540-cs/2}px;top:${circTop}px;width:${cs}px;height:${cs}px;border-radius:50%;background:${th.circ}`);
  const ground=A(s,`left:${540-170*sc}px;top:${cy+172*sc}px;width:${340*sc}px;height:2px;background:${th.line};transform-origin:50% 50%`);
  const shadow=A(s,`left:${540-115*sc}px;top:${cy+159*sc}px;width:${230*sc}px;height:24px;border-radius:50%;background:${th.shadow}`);
  const msz=380*sc;
  const mw=A(s,`left:${540-msz/2}px;top:${cy-185*sc}px;width:${msz}px;height:${msz}px`,mascot(it.mascot||'ISTP',msz,{mood:it.mood}));mw.style.transformOrigin='50% 92%';
  const ic=A(s,`left:${540+160*sc}px;top:${cy-210*sc}px;width:130px;height:130px`,icon(it.icon||'star',130));
  const desc=RV(s,`left:${MX}px;top:${descTop}px;height:${descH}px;width:${W-MX*2}px`,`<div style="font-size:${df.fs}px;color:${th.fg};${dcss}">${hl(it.desc,th)}</div>`,'white-space:normal');
  let chip=null;
  if(it.chip)chip=A(s,`left:${MX}px;top:${chipTop}px;width:${W-MX*2}px;height:104px;border-radius:52px;background:${th.fg};display:flex;align-items:center;padding:0 40px;box-sizing:border-box`,
    `<div style="font-size:25px;font-weight:900;color:${th.acc};letter-spacing:3px;width:${EP.chip_label?150:90}px;flex:none">${EP.chip_label||'TIP'}</div><div style="font-size:42px;font-weight:700;color:${th.bg}">${hl(it.chip,th)}</div>`);
  const chipSt=Math.min(2.4,ITEM-1.4);
  scenes.push({el:s,start,wipe:true,update:u=>{
    capU(u);tag.set(eOut5(pr(u,.3,.6)));title.set(eOut5(pr(u,.4,.8)));
    let p=eOut5(pr(u,.5,1));T(circ,0,0,.7+.3*p,0,pr(u,.5,.4));
    ground.style.transform=`scaleX(${eIO(pr(u,.7,.7))})`;
    const bob=Math.sin(u*2*Math.PI/1.25);p=eOut5(pr(u,.65,.9));
    T(mw,0,(1-p)*70-8*(bob*.5+.5)*p,1,Math.sin(u*2.2)*1.6*p,pr(u,.65,.25));mw.style.transform+=` scale(${1+.02*bob},${1-.015*bob})`;
    T(shadow,0,0,1-.07*(bob*.5+.5),0,pr(u,.8,.3));
    animFaces(mw,u,idx*.9);
    const ip=eBack(pr(u,.95,.6));T(ic,0,(1-ip)*40+Math.sin(u*3+idx)*-6,ip,Math.sin(u*2.4)*5,pr(u,.95,.2));
    desc.set(eOut5(pr(u,1.3,.7)));
    if(chip){const cp=eOut5(pr(u,chipSt,.8));T(chip,0,(1-cp)*60,1,0,pr(u,chipSt,.3))}
  }});
}

// ---------- outro ----------
function buildOutro(){
  const th=LIGHT,s=mkScene(th),O=EP.outro;
  const cap=RV(s,`left:${MX}px;top:170px;height:44px`,`<div style="font-size:28px;font-weight:700;color:${th.mut};letter-spacing:3px">${O.caption||EP.caption+' TOP 5'}</div>`);
  const tHtml=`${O.title[0]}<span style="color:${th.acc}">${O.title[1]}</span>${O.title[2]}`;const tfs=fitFont(tHtml,112,'font-weight:900;letter-spacing:-3px',W-MX*2-6,60);
  const title=RV(s,`left:${MX}px;top:240px;height:150px`,`<div style="font-size:${tfs}px;font-weight:900;color:${th.fg};letter-spacing:-3px;line-height:${(112*1.3/tfs).toFixed(2)}">${tHtml}</div>`);
  const data=O.rows||(MODE==='list'?ITEMS.map(x=>[x.short||x.title,'']):(MODE==='types'?ITEMS:ITEMS.slice().reverse()).map(r=>[r.type,r.nick]));
  const step=Math.min(112,Math.floor(560/data.length)),y0=440;
  const rows=data.map((d,i)=>{const y=y0+i*step;const ln=hair(s,MX,y,W-MX*2,th);const f1=Math.round(step*.54),f2=Math.round(step*.32);
    const left=d[1]?`<div style="font-size:${f1}px;font-weight:900;color:${th.fg};letter-spacing:-1px;width:260px">${d[0]}</div><div style="font-size:${f2}px;font-weight:600;color:${th.mut}">${d[1]}</div>`
                   :`<div style="font-size:${Math.round(step*.46)}px;font-weight:800;color:${th.fg};letter-spacing:-1px">${d[0]}</div>`;
    const r=RV(s,`left:${MX}px;top:${y+2}px;height:${step-4}px;width:${W-MX*2}px`,
      `<div style="display:flex;align-items:center;height:${step-4}px"><div style="width:96px;font-size:${Math.round(step*.27)}px;font-weight:800;color:${th.acc};letter-spacing:2px">0${i+1}</div>${left}</div>`);
    return {ln,r,st:.6+i*.2}});
  const endln=hair(s,MX,y0+data.length*step,W-MX*2,th);
  const cta=A(s,`left:${MX}px;top:1100px;width:${W-MX*2}px;height:120px;border-radius:60px;background:${th.fg};color:${th.bg};font-size:48px;font-weight:800;display:flex;align-items:center;justify-content:center`,O.cta);
  const hasLike=!!O.like;
  const likeBox=A(s,`left:${MX}px;top:1252px;width:700px;height:96px;border-radius:48px;border:3px solid ${th.acc};box-sizing:border-box;display:flex;align-items:center;gap:18px;padding:0 30px;font-size:36px;font-weight:800;color:${th.fg}`,
    `<svg class="hrt" width="54" height="44" viewBox="-32 -34 64 52" style="flex:none"><path d="M0 14 C-34 -8 -26 -38 0 -20 C26 -38 34 -8 0 14Z" fill="${th.acc}"/></svg><div>${hasLike?O.like:''}</div>`);
  const likeCat=A(s,`left:800px;top:1218px;width:150px;height:150px`,mascot('ISTP',150));likeCat.style.transformOrigin='50% 90%';
  if(!hasLike){likeBox.style.display='none';likeCat.style.display='none'}
  const sub=RV(s,`left:${MX}px;top:${hasLike?1400:1260}px;height:70px`,`<div style="font-size:38px;font-weight:600;color:${th.fg};line-height:1.6">${O.sub}</div>`);
  const dis=RV(s,`left:${MX}px;top:${hasLike?1490:1360}px;height:50px`,`<div style="font-size:28px;font-weight:500;color:${th.mut};line-height:1.6">${O.disclaimer}</div>`);
  scenes.push({el:s,start:OUTRO_START,wipe:true,update:v=>{
    cap.set(eOut5(pr(v,.1,.6)));title.set(eOut5(pr(v,.2,.8)));
    rows.forEach(o=>{o.ln.style.transform=`scaleX(${eIO(pr(v,o.st,.6))})`;o.r.set(eOut5(pr(v,o.st+.1,.65)))});
    endln.style.transform=`scaleX(${eIO(pr(v,1.6,.6))})`;
    const p=eOut5(pr(v,2.2,.8));T(cta,0,(1-p)*60,1,0,pr(v,2.2,.3));
    if(hasLike){const q=eOut5(pr(v,2.75,.7));T(likeBox,0,(1-q)*50,1,0,pr(v,2.75,.25));
      const pulse=1+.2*Math.max(0,Math.sin(v*2*Math.PI/.625-1.2))*pr(v,3.2,.1);likeBox.querySelector('.hrt').style.transform=`scale(${pulse})`;
      const cq=eOut5(pr(v,2.95,.7));T(likeCat,(1-cq)*120,0,1,Math.sin(v*7)*(v>3.5?4:0),pr(v,2.95,.2));animFaces(likeCat,v,1.3)}
    sub.set(eOut5(pr(v,hasLike?3.2:2.7,.7)));dis.set(eOut5(pr(v,hasLike?3.7:3.3,.7)));
  }});
}

let prog=null,built=false;
function build(){
  buildIntro();
  ITEMS.forEach((it,i)=>MODE==='list'?buildItem(it,i):buildRank(it,i));
  buildOutro();
  prog=A(stage,`left:0;top:0;width:${W}px;height:6px;background:${AC};transform-origin:0 50%;z-index:99`);
  built=true;
}
window.render=function(t){
  if(!built)return;
  scenes.forEach((sc,i)=>{
    const next=scenes[i+1];
    const vis=t>=sc.start&&(!next||t<next.start+.9);
    sc.el.style.display=vis?'block':'none';
    if(!vis)return;
    if(sc.wipe){const p=eIO(pr(t,sc.start,.8));sc.el.style.clipPath=p>=1?'none':`inset(${(1-p)*100}% 0 0 0)`}
    else sc.el.style.clipPath='none';
    sc.update(t-sc.start);
  });
  prog.style.transform=`scaleX(${cl(t/DUR)})`;
};
